<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nodeway VPN</title>
<script>
  /*
   * Режим оформления ставится до первой отрисовки.
   *
   * Приложение передаёт его адресом страницы (?theme=dark): вызовом после
   * загрузки система успела бы показать светлый фон на тёмной теме.
   */
  (function () {
    document.documentElement.setAttribute(
        'data-theme', /[?&]theme=dark/.test(location.search) ? 'dark' : 'light');
  })();
</script>
<style>
    /*
     * Палитра.
     *
     * Значения живут в двух наборах: светлом, он же умолчательный, и тёмном,
     * который включается атрибутом data-theme на <html>. Режим сообщает
     * приложение — при старте адресом страницы, при смене темы системы вызовом.
     *
     * Цвета, у которых есть смысловое имя, названы по нему: так видно их в
     * одном месте, вместо разбросанных по правилам литералов.
     */
    :root {
        /* Нативные контролы — чекбоксы в пикере, курсор, полосы прокрутки —
           без этого WebView рисует их в светлой схеме даже на тёмной теме. */
        color-scheme: light;
        --bg: #F2F2F7;
        --card: #FFFFFF;
        --line: #E3E3E8;
        --text: #000000;
        --muted: #8A8A8E;
        --blue: #007AFF;
        --green: #34C759;
        --red: #FF3B30;

        /* Всё, что не выводится прямо из базовых цветов. */
        --power-ring: #E4E4EA;
        --chip-info-bg: #E1EFFF;
        --chip-ok-bg: #DCF5E6;
        --chip-ok-fg: #1E8E3E;
        --chip-error-bg: #FDE0E0;
        --chip-error-fg: #C5221F;
        --chip-idle-bg: #EEF0F4;
        --pressed-row: #EFEFF4;
        --pressed-btn: #E3E3E8;
        --knob: #FFFFFF;
        --track: rgba(11, 15, 20, .15);
        --press-tint: rgba(0, 0, 0, .06);
        --sheet: rgba(250, 250, 250, .96);
        --sheet-strong: rgba(250, 250, 250, .97);
        --log-xray: #7f8fa6;
        --log-olcrtc: #6f9c86;
        --log-warn: #c9a227;
        --log-error: #e0625f;

        /* Отступы под системные панели: приложение передаёт их из Kotlin (setInsets). */
        --inset-top: 0px;
        --inset-bottom: 0px;
    }

    /*
     * Тёмный набор: те же роли в тёмных тонах.
     *
     * Значения из тёмной палитры iOS — чёрный фон, #1C1C1E для карточек.
     * Второстепенный текст здесь светлее, чем на светлом фоне: на чёрном
     * тот же оттенок нечитаем.
     */
    :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #000000;
        --card: #1C1C1E;
        --line: #38383A;
        --text: #FFFFFF;
        --muted: #8E8E93;
        --blue: #0A84FF;
        --green: #30D158;
        --red: #FF453A;

        --power-ring: #2C2C2E;
        --chip-info-bg: #12263F;
        --chip-ok-bg: #16351F;
        --chip-ok-fg: #30D158;
        --chip-error-bg: #3A1B1B;
        --chip-error-fg: #FF6B5E;
        --chip-idle-bg: #2C2C2E;
        --pressed-row: #2C2C2E;
        --pressed-btn: #3A3A3C;
        --knob: #FFFFFF;
        --track: rgba(255, 255, 255, .18);
        --press-tint: rgba(255, 255, 255, .12);
        --sheet: rgba(28, 28, 30, .96);
        --sheet-strong: rgba(30, 30, 32, .97);
        --log-xray: #8FA3BA;
        --log-olcrtc: #7FB89E;
        --log-warn: #E0B54A;
        --log-error: #FF7B72;
    }

    /*
     * Тот же тёмный набор по системной теме — иначе страница выглядит для
     * WebView «не умеющей» в тёмную: он спрашивает prefers-color-scheme,
     * получает отказ и перекрашивает всё сам алгоритмически. Цвета выходят
     * «чуть не те», и на Android 10 это происходит даже при явном выборе
     * светлой темы в приложении.
     *
     * :not([data-theme='light']) оставляет выбор пользователя главнее системы:
     * режим приходит атрибутом, и он всегда выставлен, так что правило срабатывает
     * только когда атрибута нет вовсе — то есть почти никогда. Оно нужно ради
     * самого факта, что страница на prefers-color-scheme отвечает.
     *
     * Правила с разными условиями в одно не объединить, а править набор нужно в
     * обоих — так он и продублирован.
     */
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
            color-scheme: dark;
            --bg: #000000;
            --card: #1C1C1E;
            --line: #38383A;
            --text: #FFFFFF;
            --muted: #8E8E93;
            --blue: #0A84FF;
            --green: #30D158;
            --red: #FF453A;

            --power-ring: #2C2C2E;
            --chip-info-bg: #12263F;
            --chip-ok-bg: #16351F;
            --chip-ok-fg: #30D158;
            --chip-error-bg: #3A1B1B;
            --chip-error-fg: #FF6B5E;
            --chip-idle-bg: #2C2C2E;
            --pressed-row: #2C2C2E;
            --pressed-btn: #3A3A3C;
            --knob: #FFFFFF;
            --track: rgba(255, 255, 255, .18);
            --press-tint: rgba(255, 255, 255, .12);
            --sheet: rgba(28, 28, 30, .96);
            --sheet-strong: rgba(30, 30, 32, .97);
            --log-xray: #8FA3BA;
            --log-olcrtc: #7FB89E;
            --log-warn: #E0B54A;
            --log-error: #FF7B72;
        }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
        font-size: 17px;
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
    }

    /*
     * Прокручивается весь документ, а не вложенный блок страницы.
     * Иначе на части устройств жест «заедает»: начатый над шапкой или кнопкой
     * питания, он не листает, и докрутив блок до конца, страница не идёт дальше.
     */
    html, body { height: auto; }

    body {
        display: block;
        padding-bottom: var(--inset-bottom);
    }

    .page { display: none; }
    .page.active { display: block; }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    svg { display: block; }

    /* ---------- верхняя панель ---------- */

    .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 18px 10px;
        background: var(--bg);
        position: sticky;
        top: 0;
        z-index: 20;
		padding-top: calc(max(var(--inset-top), env(safe-area-inset-top)) + 8px);
    }

    /* На «Настройках» верхние кнопки («+» и шестерёнка) не нужны. */
    .navbar.hidden { display: none; }

    /* Верхняя панель настроек: там живёт кнопка «Назад». */
    .settings-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: calc(max(var(--inset-top), env(safe-area-inset-top)) + 8px) 18px 8px;
        background: var(--bg);
    }

    .nav-link { color: var(--blue); font-size: 17px; padding: 4px 0; }
    .nav-link.big { font-size: 28px; line-height: 1; padding: 0 4px; }
    .nav-link svg { width: 24px; height: 24px; }

    /* ---------- кнопка питания ---------- */

    .power-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 16px 26px;
    }

    .uptime {
        text-align: center;
        margin-bottom: 24px;
    }

    .uptime-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
    }

    .uptime-value {
        margin-top: 2px;
        font-size: 32px;
        font-weight: 700;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        letter-spacing: .5px;
    }

    /* Отклик через туннель. Не «пинг»: в цифру входит и путь до адреса замера. */
    .latency {
        margin-top: 6px;
        min-height: 18px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        letter-spacing: 1px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }

    .power-box {
        background: var(--power-ring);
        border-radius: 28px;
        padding: 12px;
    }

    .power-btn {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: var(--blue);
        display: grid;
        place-items: center;
        transition: background .2s ease, transform .1s ease;
    }

    .power-btn:active { transform: scale(.94); }
    .power-btn.on { background: var(--green); }
    .power-btn.busy { background: var(--muted); }

    /* Material 3: чип статуса без шеврона, с серым/голубым контейнером. */
    .status-chip {
        margin-top: 20px;
        display: flex;
        align-items: center;
        background: var(--chip-info-bg);
        color: var(--blue);
        border-radius: 999px;
        padding: 9px 24px;
        font-size: 15px;
        font-weight: 600;
        width: 145px;
        justify-content: center;
    }

    .status-chip.on { background: var(--chip-ok-bg); color: var(--chip-ok-fg); }
    .status-chip.error { background: var(--chip-error-bg); color: var(--chip-error-fg); }
    .status-chip.busy { background: var(--chip-idle-bg); color: var(--muted); }

    .status-hint {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        max-width: 300px;
    }

    /* ---------- группы ---------- */

    .section-title {
        font-size: 13px;
        color: var(--blue);
        margin: 22px 32px 8px;
        text-transform: uppercase;
        letter-spacing: .4px;
    }

    .group {
        background: var(--card);
        border-radius: 12px;
        margin: 0 16px 8px;
        overflow: hidden;
    }

    .group-head {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        /* Шапка перестала быть <button>: внутрь неё легла кнопка проверки,
           а вложенные интерактивные элементы невалидны и ломают клик. */
        cursor: pointer;
    }

    .group-title {
        flex: 1;
        min-width: 0;
        font-size: 19px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .group-title.small { font-size: 19px; }
    .chevron { color: var(--blue); transition: transform .2s ease; }
    .group.collapsed .chevron { transform: rotate(-90deg); }

    /*
     * Плавное сворачивание: анимируем высоту строки grid 1fr → 0fr,
     * поэтому переход идёт по реальной высоте содержимого, а не по display.
     */
    .group-body {
        display: grid;
        grid-template-rows: 1fr;
        transition: grid-template-rows .28s ease;
    }

    .group-inner {
        overflow: hidden;
        min-height: 0;
    }

    .group.collapsed .group-body { grid-template-rows: 0fr; }

    /* Свёрнутая группа — только заголовок, без разделителя под ним. */
    .group.collapsed .group-head { border-bottom: none; }
    .group.collapsed .row:last-child,
    .group.collapsed .group-inner > *:last-child { border-bottom: none; }

    /* ---------- строка профиля ---------- */

    .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 12px 16px 12px 14px;
        border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: none; }
    .row:active { background: var(--pressed-row); }

    /* Смещение нужно только в строках режима: их текст начинается с первой строки,
       а маркер по умолчанию центрируется по всей строке. */
    .mode-row .mark { margin-top: 3px }

    .mark.on { border-color: var(--blue); }

    .mark.on::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: var(--blue);
    }

    .row-body { flex: 1; min-width: 0; }

    .row-title {
        font-size: 17px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .row-sub {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .info-btn {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        border: 2px solid var(--blue);
        color: var(--blue);
        display: grid;
        place-items: center;
        flex: none;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
    }

    /* «i» всегда синяя: подключение на вид не влияет. */
    .info-btn.active { color: var(--blue); border-color: var(--blue); background: none; }

    /* Кнопка проверки в шапке группы: дискретная, чтобы не спорить с кнопкой питания. */
    .ping-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        flex: none;
        padding: 0;
        border-radius: 50%;
        background: var(--line);
        color: var(--blue);
        cursor: pointer;
    }

    .ping-btn:disabled {
        opacity: 0.4;
        cursor: default;
    }

    .ping-btn:not(:disabled):active { background: var(--pressed-btn); }

    /* Плашка отклика в строке профиля, рядом с «i». */
    .ping-badge {
        display: flex;
        align-items: center;
        height: 25px;
        flex: none;
        padding: 0 8px;
        border-radius: 12px;
        background: var(--line);
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
    }

    /* Пустая плашка не должна занимать место — она ждёт первого результата. */
    .ping-badge:empty { display: none; }

    .ping-badge.bad { color: var(--red); }

    .ping-badge.active { color: var(--blue); }

    .empty { padding: 18px 16px; color: var(--muted); font-size: 15px; }

    /* ---------- журнал ---------- */

    .log {
        background: var(--card);
        border-radius: 12px;
        margin: 8px 16px 22px;
        overflow: hidden;
    }

    .log .group-head { border-bottom: none; }
    .log .group-title { font-size: 13px; text-transform: uppercase; color: var(--muted); }

    #logBody {
        padding: 0 16px 12px;
        font-size: 12px;
        color: var(--muted);
        max-height: 220px;
        overflow-y: auto;
        font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    /* Вывод ядер — тусклее сообщений приложения, иначе журнал нечитаем. */
    #logBody .log-line.xray { color: var(--log-xray); }
    #logBody .log-line.olcrtc { color: var(--log-olcrtc); }

    /* Предупреждения и ошибки выделяются: их и ищут в первую очередь. */
    #logBody .log-line.warn { color: var(--log-warn); }
    #logBody .log-line.error { color: var(--log-error); }

    /* Переключатель уровня журнала. */
    .log-filter {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px 10px;
    }

    .log-filter button {
        border: none;
        background: none;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
    }

    /* Активный фильтр — плашка поверх белой карточки, поэтому берём фон страницы:
       белый по белому не читался, а переменной --fg в палитре не было. */
    .log-filter button.active { background: var(--bg); color: var(--text); }

    .log-filter .log-hint {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
        opacity: 0.7;
    }

    /* Переключатель в настройках: выключатель, а не выбор из списка. */
    .switch {
        flex: none;
        width: 51px;
        height: 31px;
        border-radius: 16px;
        background: var(--line);
        position: relative;
        transition: background .18s ease;
    }

    .switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 27px;
        height: 27px;
        border-radius: 50%;
        background: var(--knob);
        box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
        transition: transform .18s ease;
    }

    .switch.on { background: var(--blue); }
    .switch.on::after { transform: translateX(20px); }

    /* ---------- настройки ---------- */

    .settings-row {
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 17px;
    }

    .settings-row:last-child { border-bottom: none; }
    .settings-row.center { justify-content: center; color: var(--blue); }
    .settings-row .value {
        flex: none;
        margin-left: auto;
        color: var(--muted);
        font-size: 15px;
    }
    .settings-row small {
        display: block;
        flex: 1;
        min-width: 0;
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
    }

  /* Синие действия в настройках — как «Добавить из буфера». */
  .settings-row .value.accent {
    color: var(--blue);
    width: 82px;
  }

  /* Плашка подписки: тело занимает три строки, кнопки прижаты к заголовку,
     иначе align-items: center ставит их между «Профилей» и отсчётом. */
  .settings-row.sub-row {
    align-items: flex-start;
  }

  .settings-row.sub-row > span {
    flex: 1;
    min-width: 0;
  }

  /* Спиннер загрузки подписки: кольцо с вращающейся «шапкой». */
  .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--track);
      border-top-color: var(--blue);
      animation: spin .7s linear infinite;
      vertical-align: -3px;
  }

  @keyframes spin {
  to { transform: rotate(360deg); }
  }

  .settings-row .value:disabled {
  opacity: .6;
  pointer-events: none;
  }

    /* Раскладка страницы задана выше: display у .page переключается через .active. */

    /* Атрибут hidden должен побеждать display из классов: иначе он не прячет. */
    [hidden] { display: none !important; }

    /* ---------- раздельное туннелирование ---------- */

    .mode-row { align-items: flex-start; }

    .mode-copy { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }

    .mode-copy small {
        display: block;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.3;
    }

    /* Кружок выбора: как в iOS, пустой или с точкой. Один и тот же и в режимах
       туннелирования, и в списке профилей. */
    .mark {
        flex: none;
        position: relative;
        width: 22px;
        height: 22px;
        border: 2px solid var(--line);
        border-radius: 50%;
    }

    /* ---------- лист выбора приложений ---------- */

    .picker {
        position: fixed;
        inset: 0;
        z-index: 45;
        display: none;
        flex-direction: column;
        background: var(--bg);
    }

    .picker.open { display: flex; }

    .picker-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: calc(max(var(--inset-top), env(safe-area-inset-top)) + 10px) 8px 10px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
    }

    .picker-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }

    .nav-link.accent { color: var(--blue); font-weight: 600; }

    .picker-tools {
        padding: 10px 16px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
    }

    .picker-input {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 10px;
        background: var(--bg);
        color: inherit;
        font: inherit;
        font-size: 16px;
    }

    /* Крестик очистки лежит поверх поля, поэтому тексту нужен запас справа. */
    .picker-search { position: relative; }
    .picker-search .picker-input { padding-right: 40px; }

    .picker-search-clear {
        position: absolute;
        top: 50%;
        right: 4px;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: var(--muted);
    }

    .picker-search-clear:active { background: var(--press-tint); }

    .picker-switch {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 10px;
        font-size: 14px;
        color: var(--muted);
    }

    .picker-switch input { width: 18px; height: 18px; accent-color: var(--blue); }

    /* Переключатель системных и кнопка очистки делят одну строку. */
    .picker-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .picker-clear { flex: none; color: var(--blue); font-size: 14px; }
    .picker-clear:disabled { color: var(--muted); opacity: 0.4; }

    .picker-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Пока мост считает список приложений, вместо него показываем заглушку. */
    .picker-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 32px 16px;
        color: var(--muted);
        font-size: 15px;
    }

    .picker-group {
        padding: 14px 16px 6px;
        font-size: 13px;
        text-transform: uppercase;
        color: var(--muted);
    }

    .app-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 9px 16px;
        border-bottom: 1px solid var(--line);
    }

    .app-icon {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 9px;
        background: var(--line);
    }

    .app-copy { flex: 1; min-width: 0; }

    .app-name { display: block; font-size: 16px; overflow-wrap: anywhere; }
    .app-pkg { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

    .app-box {
        flex: none;
        position: relative;
        width: 22px;
        height: 22px;
        border: 2px solid var(--line);
        border-radius: 6px;
    }

    .app-row.on .app-box { border-color: var(--blue); background: var(--blue); }

    .app-row.on .app-box::after {
        content: "";
        position: absolute;
        left: 6px;
        top: 2px;
        width: 5px;
        height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    /* ---------- шторка действий ---------- */

    .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .4);
        display: none;
        z-index: 40;
    }

    .scrim.open { display: block; }

    .sheet {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(max(var(--inset-bottom), env(safe-area-inset-bottom)) + 12px);
        background: var(--sheet);
        backdrop-filter: blur(20px);
        border-radius: 14px;
        overflow: hidden;
        z-index: 41;
        /*
         * Прячем через visibility/opacity: сдвиг вниз перестал бы прятать шторку,
         * когда bottom учитывает высоту навигационной панели.
         */
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateY(16px);
        transition: opacity .22s ease, transform .22s ease, visibility .22s;
    }

    .sheet.open {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
    }

    .sheet-item {
        display: block;
        width: 100%;
        text-align: center;
        font-size: 19px;
        color: var(--blue);
        padding: 17px 12px;
        border-bottom: 1px solid var(--line);
    }

    .sheet-item:last-child { border-bottom: none; color: var(--red); }

    /* Выбранный пункт листа отмечен галочкой: без неё три варианта неотличимы. */
    .sheet-item.current::after { content: ' ✓'; }

    /* ---------- модальное окно профиля ---------- */

    .modal {
        position: fixed;
        left: 16px;
        right: 16px;
        top: 50%;
        transform: translateY(-50%) scale(.9);
        max-width: 420px;
        margin: 0 auto;
        background: var(--sheet-strong);
        backdrop-filter: blur(20px);
        border-radius: 14px;
        overflow: hidden;
        z-index: 41;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s ease, transform .2s ease;
    }

    .modal.open { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }

    /* ---------- диалог подтверждения ---------- */

    /*
     * Свой диалог вместо системного window.confirm: тот выглядит чужеродно
     * («The page at file:// says») и не поддаётся стилизации.
     */
    .modal.alert { text-align: center; }

    .alert-head {
        padding: 20px 18px 4px;
        font-size: 17px;
        font-weight: 600;
    }

    .alert-text {
        padding: 0 18px 4px;
        font-size: 14px;
        line-height: 1.4;
        color: var(--muted);
    }

    .alert-actions { display: flex; border-top: 1px solid var(--line); }

    .alert-btn {

        color: var(--blue);
        border-right: 1px solid var(--line);
    }

    .alert-btn.danger { color: var(--red); font-weight: 600; border-right: none; }

    .modal-head { padding: 18px 16px 10px; text-align: center; font-size: 17px; font-weight: 600; }

    .detail {

        border-bottom: 1px solid var(--line);
    }

    .detail .k { color: var(--muted); flex: none; }
    .detail .v { text-align: right; word-break: break-all; }
</style>

<script>
(function () {
    'use strict';

    var bridge = window.NodewayVpn;

    var state = 'disconnected';
    var model = {
        profiles: [],
        subscriptions: [],
        selectedProfileId: '',
        activeProfileId: '',
        connectedAt: 0
    };
    /**
     * Прогресс проверки откликов.
     *
     * Живёт отдельно от модели: за один прогон приходит десяток событий, и
     * ради каждого перерисовывать список было бы нельзя — плашки обновляются
     * точечно, по одной на профиль.
     */
    var ping = { running: false, index: 0, total: 0, profileId: '', results: {} };
    var coreVersion = '';
    var modalProfileId = '';
    var logCollapsed = false;

    /** Выбранная тема: 'system', 'light' или 'dark'. */
    var themeMode = 'system';

    /** Как темы выглядят в строке настроек. */
    var THEME_NAMES = { system: 'Как в системе', light: 'Светлая', dark: 'Тёмная' };

    /** Записи журнала целиком: перерисовка под фильтр идёт из этого массива. */
    var journalEntries = [];

    /** 'all' или 'problems'. */
    var logFilter = 'all';

    /** Ведётся ли журнал — выключатель из настроек. */
    var journalEnabled = false;

    /** Сколько записей из буфера уже выведено в #logBody. */
    var renderedUpTo = 0;

    /** Когда список в DOM надо перерисовать целиком, а не дополнить. */
    var renderFull = true;

    /**
     * Свёрнутые группы: по id подписки и отдельно для локальных профилей.
     * Состояние переживает перезапуск приложения — лежит в localStorage,
     * поэтому перерисовка групп его не сбрасывает.
     */
    var COLLAPSED_KEY = 'nodeway.collapsed';
    var collapsed = loadCollapsed();

    function loadCollapsed() {
      var fallback = { subscriptions: {}, local: false, log: false };
      try {
        var raw = localStorage.getItem(COLLAPSED_KEY);
        if (!raw) return fallback;
        var saved = JSON.parse(raw);
        return {
          subscriptions: saved && saved.subscriptions ? saved.subscriptions : {},
          local: !!(saved && saved.local),
          log: !!(saved && saved.log)
        };
      } catch (e) {
        return fallback;
      }
    }

    function saveCollapsed() {
      try {
        localStorage.setItem(COLLAPSED_KEY, JSON.stringify(collapsed));
      } catch (e) { /* приватный режим — просто не сохраняем */ }
    }

    var el = {
        powerBtn: document.getElementById('powerBtn'),
        uptime: document.getElementById('uptime'),
        latency: document.getElementById('latency'),
        statusText: document.getElementById('statusText'),
        statusHint: document.getElementById('statusHint'),
        statusChip: document.getElementById('statusChip'),
        subscriptions: document.getElementById('subscriptions'),
        localGroup: document.getElementById('localGroup'),
        subAdmin: document.getElementById('subAdmin'),
        logBody: document.getElementById('logBody'),
        logChev: document.getElementById('logChev'),
        logCard: document.getElementById('logCard'),
        logFilter: document.getElementById('logFilter'),
        logHint: document.getElementById('logHint'),
        journalRow: document.getElementById('journalRow'),
        journalSwitch: document.getElementById('journalSwitch'),
        scrim: document.getElementById('scrim'),
        sheet: document.getElementById('sheet'),
        themeSheet: document.getElementById('themeSheet'),
        themeRow: document.getElementById('themeRow'),
        themeValue: document.getElementById('themeValue'),
        modal: document.getElementById('modal'),
        modalTitle: document.getElementById('modalTitle'),
        modalBody: document.getElementById('modalBody'),
        modalConnect: document.getElementById('modalConnect'),
        coreVersion: document.getElementById('coreVersion'),
    alert: document.getElementById('alert'),
    alertTitle: document.getElementById('alertTitle'),
    alertText: document.getElementById('alertText'),
    alertOk: document.getElementById('alertOk'),
    alertCancel: document.getElementById('alertCancel')
    };

    // Подключено: две одинаковые полоски по центру круга, как в iOS.
    var ICON_POWER_ON =
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" ' +
        'stroke-linecap="round"><path d="M9.1 6.9v10.2"/><path d="M14.9 6.9v10.2"/></svg>';
    var ICON_POWER_OFF =
        '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" ' +
        'stroke-linecap="round"><path d="M12 4.5v7.5"/><path d="M7.6 7a6.8 6.8 0 1 0 8.8 0"/></svg>';

    /** Иконка «проверить профили» для шапки группы. */
    var ICON_PING =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round"><path d="M3 12h3l2-6 3 12 2.5-8 1.5 4H21"/></svg>';

    var ICON_CHEV =
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
        'stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15.5 18 9.5"/></svg>';

    // ------------------------------------------------------------------ utils

    function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
    }

    function svg(markup) {
        var wrap = document.createElement('div');
        wrap.innerHTML = markup;
        return wrap.firstChild;
    }

    /** У SVG свойство className только для чтения, поэтому задаём атрибутом. */
    function chevron() {
        var node = svg(ICON_CHEV);
        node.setAttribute('class', 'chevron');
        return node;
    }

    /** Спиннер загрузки: кольцо с вращающейся «шапкой». */
    function spinner() {
        var node = document.createElement('span');
        node.className = 'spinner';
        return node;
    }

    function parse(json) {
        try { return JSON.parse(json); } catch (e) { return null; }
    }

    /** Сколько строк держим в журнале. */
    var MAX_LOG_LINES = 200;

    /** Сколько записей держим в памяти страницы. */
    var MAX_JOURNAL_ENTRIES = 400;

    function pad(value) { return ('0' + value).slice(-2); }

    /** ЧЧ:ММ:СС с ведущими нулями. */
    function clockOf(millis) {
        var d = new Date(millis);
        return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    /**
 * Рисует порцию записей журнала.
 *
 * Записи приходят из нативной части: там подписка на источник и чтение логов ядер.
 * Собственные сообщения страницы идут через log() в тот же список.
 */
    function appendJournal(entries, reset) {
        if (!journalEnabled) {
            journalEntries = [];
            renderFull = true;
            return;
        }
        journalEntries = reset ? (entries || []).slice() : journalEntries.concat(entries || []);
        if (journalEntries.length > MAX_JOURNAL_ENTRIES) {
            journalEntries = journalEntries.slice(-MAX_JOURNAL_ENTRIES);
        }
        renderJournal();
    }

    /**
     * Обновляет список журнала.
     *
     * Новые строки дописываются в конец, а не пересоздаётся весь список: ядра
     * пишут по несколько строк в секунду, и полная перерисовка на каждой пачке
     * съедала бы CPU впустую.
     *
     * Свёрнутый журнал не трогаем вообще — строить невидимые узлы незачем.
     */
    function renderJournal() {
        var shown = 0;
        journalEntries.forEach(function (entry) {
            if (visibleIn(entry)) shown++;
        });
        el.logHint.textContent = shown === journalEntries.length
            ? ''
            : shown + ' из ' + journalEntries.length;

        if (!journalEnabled || logCollapsed) return;

        if (renderFull || renderedUpTo > journalEntries.length) {
            el.logBody.textContent = '';
            renderedUpTo = 0;
            renderFull = false;
        }

        for (var i = renderedUpTo; i < journalEntries.length; i++) {
            if (!visibleIn(journalEntries[i])) continue;
            el.logBody.appendChild(journalLine(journalEntries[i]));
        }
        renderedUpTo = journalEntries.length;

        while (el.logBody.childElementCount > MAX_LOG_LINES) {
            el.logBody.removeChild(el.logBody.firstChild);
        }
        el.logBody.scrollTop = el.logBody.scrollHeight;
    }

    function journalLine(entry) {
        var source = entry.s || 'app';
        var line = document.createElement('div');
        line.className = 'log-line ' + source + ' ' + (entry.l || 'info');
        line.textContent = clockOf(entry.t) + '  ' +
            (source === 'app' ? '' : source + ' · ') + entry.m;
        return line;
    }

    /** В режиме «проблемы» показываем только предупреждения и ошибки. */
    function visibleIn(entry) {
        if (logFilter === 'all') return true;
        return entry.l === 'warn' || entry.l === 'error';
    }

    /** Собственное сообщение страницы: попадает в журнал без источника. */
    function log(message) {
        if (!message || !journalEnabled) return;
        appendJournal([{ t: Date.now(), s: 'app', l: 'info', m: message }], false);
    }

    /**
     * Применяет состояние выключателя журнала.
     *
     * Выключенный журнал — это не пустой список, а отсутствие карточки:
     * иначе на главном экране остаётся рамка с пустотой.
     */
    function applyJournalEnabled(value) {
        journalEnabled = !!value;
        el.journalSwitch.classList.toggle('on', journalEnabled);
        el.logCard.hidden = !journalEnabled;
        renderFull = true;
        journalEntries = [];
        el.logBody.textContent = '';
    }

    window.onJournalEnabled = function (value) {
        applyJournalEnabled(value);
    };

    window.onJournalReset = function (payload) {
        renderFull = true;
        journalEntries = [];
        appendJournal(parse(payload), true);
    };

    window.onJournalEntries = function (payload) {
        appendJournal(parse(payload), false);
    };

    function profileById(id) {
        return model.profiles.filter(function (p) { return p.id === id; })[0] || null;
    }

    /** ЧЧ:ММ:СС с ведущими нулями. */
    function formatUptime(millis) {
        var total = Math.max(0, Math.floor(millis / 1000));
        var hours = Math.floor(total / 3600);
        var minutes = Math.floor(total % 3600 / 60);
        var seconds = total % 60;
        return pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
    }

    function renderUptime() {
        // Во время проверки время подключения не показываем: туннель живёт
        // понемногу на каждом профиле, и счётчик скакал бы в обе стороны.
        if (ping.running) {
            el.uptime.textContent = '00:00:00';
            return;
        }
        var running = state === 'connected' && model.connectedAt > 0;
        el.uptime.textContent = running ? formatUptime(Date.now() - model.connectedAt) : '00:00:00';
    }

    /**
     * Отклик, измеренный через туннель. Показываем именно формулировкой про
     * туннель, а не «пинг»: в цифру входит ещё и путь до адреса, который опрашиваем.
     * 0 означает «замера не было» — туннель может быть жив, но первый замер
     * ещё не успел вернуться, и пустая строка тут честнее нуля.
     */
    function renderLatency() {
      var ms = Number(model.latency) || 0;
      if (state !== 'connected' || ms <= 0) {
        el.latency.textContent = '';
        return;
      }
      el.latency.textContent = 'Отклик через туннель: ' + ms + ' мс';
    }

    /** Приводит прогресс из моста к предсказуемому виду. */
    function normalizePing(raw) {
        var results = {};
        if (raw && raw.results) {
            Object.keys(raw.results).forEach(function (key) {
                results[key] = Number(raw.results[key]);
            });
        }
        return {
            running: !!(raw && raw.running),
            index: Number((raw && raw.index) || 0),
            total: Number((raw && raw.total) || 0),
            profileId: (raw && raw.profileId) || '',
            results: results
        };
    }

    /**
     * Обновляет плашки без перерисовки списков.
     *
     * Списки перерисовывать нельзя: каждое событие проверки сбрасывало бы
     * прокрутку и состояние развёрнутых групп.
     */
    function updatePingBadges() {
        var rows = document.querySelectorAll('.row[data-profile-id]');
        for (var i = 0; i < rows.length; i++) {
            var badge = rows[i].querySelector('.ping-badge');
            if (!badge) continue;
            var id = rows[i].getAttribute('data-profile-id');
            var ms = ping.results[id];
            var current = ping.running && ping.profileId === id;
            badge.className = 'ping-badge'
                + (current ? ' active' : '')
                + (typeof ms === 'number' && ms < 0 ? ' bad' : '');
            badge.textContent = current ? '…'
                : (typeof ms === 'number' ? (ms < 0 ? '—' : ms + ' мс') : '');
        }
    }

    /** Гасит кнопки проверки, пока очередь занята. */
    function updatePingButtons() {
        var buttons = document.querySelectorAll('.ping-btn');
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].disabled = ping.running;
            buttons[i].classList.toggle('busy', ping.running);
        }
    }

    function startPing(ids) {
        if (!ids.length || ping.running) return;
        bridge.pingProfiles(JSON.stringify(ids));
    }

    function selectedProfile() {
        return profileById(model.selectedProfileId);
    }

    // ------------------------------------------------------------------ render

    /**
     * Подписи данных, из которых собраны списки.
     *
     * Пока подпись не менялась, список не пересобираем. Пересборка создаёт строки
     * заново, а вместе с ними и «галочку» выбранного профиля, у которой своя
     * анимация появления, — та моргала бы на глазах при каждом событии состояния,
     * даже когда сами профили не менялись.
     */
    var rowsSignature = null;
    var subsSignature = null;

    function render() {
        renderPower();
        renderUptime();
        renderLatency();

        var rows = JSON.stringify([model.profiles, model.selectedProfileId]);
        if (rows !== rowsSignature) {
            rowsSignature = rows;
            renderSubscriptions();
            renderLocals();
        }
        syncActiveRows();

        // Список подписок в настройках живёт своей жизнью: кнопка «Обновить»
        // крутит спиннер, обратный отсчёт тикает сам. Пересобирать его имеет
        // смысл, только когда данные подписок действительно другие.
        var subs = JSON.stringify(model.subscriptions);
        if (subs !== subsSignature) {
            subsSignature = subs;
            renderSubAdmin();
        }

        updatePingBadges();
        updatePingButtons();
    }

    /**
     * Подсветка «i» у активного профиля.
     *
     * Зависит она только от activeProfileId, поэтому при смене подключения её
     * достаточно переключить на месте: собирать заново весь список ради одного
     * класса не нужно.
     */
    function syncActiveRows() {
        var rows = document.querySelectorAll('.row[data-profile-id]');
        for (var i = 0; i < rows.length; i++) {
            var info = rows[i].querySelector('.info-btn');
            if (!info) continue;
            var active = rows[i].getAttribute('data-profile-id') === model.activeProfileId;
            info.className = 'info-btn' + (active ? ' active' : '');
        }
    }

    function renderPower() {
        var on = state === 'connected';
        var busy = state === 'connecting' || state === 'disconnecting';
        // Во время проверки туннель то поднимается, то гаснет на каждом профиле.
        // Кнопку питания по указанию не дёргаем: гасим и блокируем, а смысл
        // показываем в плашке статуса.
        var checking = ping.running;

        el.powerBtn.className = 'power-btn' + (on ? ' on' : '') + (busy || checking ? ' busy' : '');
        el.powerBtn.innerHTML = on ? ICON_POWER_ON : ICON_POWER_OFF;
        el.powerBtn.disabled = busy || checking;

        var active = profileById(model.activeProfileId);
        el.statusChip.className = 'status-chip' + (checking ? ' busy'
            : on ? ' on' : busy ? ' busy' : state === 'error' ? ' error' : '');
        el.statusText.textContent = checking
            ? 'Проверка: ' + (ping.index + 1) + ' из ' + ping.total
            : {
                disconnected: 'Отключено',
                connecting: 'Подключение',
                connected: 'Подключено',
                disconnecting: 'Отключение',
                error: 'Ошибка'
            }[state] || 'Отключено';

        var hint;
        if (checking) {
            var current = profileById(ping.profileId);
            hint = current ? 'Проверяем: ' + current.name : 'Проверяем профиль…';
        } else if (state === 'error') {
            hint = lastMessage || 'Не удалось подключиться';
        } else if (on && active) {
            hint = active.name;
        } else {
            var selected = selectedProfile();
            hint = selected ? 'Выбрано: ' + selected.name : 'Выберите профиль и нажмите кнопку питания';
        }
        el.statusHint.textContent = hint;
    }

    /**
     * Группа профилей со сворачиваемым заголовком.
     *
     * Подписки и локальные профили отличаются только заголовком, набором строк
     * и текстом пустого состояния, поэтому собираются здесь одним кодом.
     * Группа переиспользует переданный узел, если он уже есть в разметке.
     */
    function profileGroup(options, group) {
        group = group || document.createElement('div');
        // Состояние свёртки храним отдельно, иначе перерисовка его сбрасывает.
        group.className = 'group' + (options.collapsed ? ' collapsed' : '');

        // Шапка — div с ролью кнопки, а не <button>: внутрь легла кнопка проверки,
        // а вложенные интерактивные элементы невалидны и ломают клик по шапке.
        var head = document.createElement('div');
        head.className = 'group-head';
        head.setAttribute('role', 'button');
        head.setAttribute('tabindex', '0');

        var title = document.createElement('span');
        title.className = options.titleClass || 'group-title';
        title.textContent = options.title;
        head.appendChild(title);

        // Кнопка проверки стоит сразу за названием группы — туда, куда её и просили.
        if (options.pingable) {
            var pingBtn = document.createElement('button');
            pingBtn.type = 'button';
            pingBtn.className = 'ping-btn';
            pingBtn.setAttribute('aria-label', 'Проверить профили группы «' + options.title + '»');
            pingBtn.innerHTML = ICON_PING;
            pingBtn.onclick = function (event) {
                event.stopPropagation();
                startPing(options.rows.map(function (p) { return p.id; }));
            };
            head.appendChild(pingBtn);
        }

        // Счётчик есть только у локальных профилей: у подписки его роль играет облако.
        if (options.count != null) {
            var badge = document.createElement('span');
            badge.className = 'row-sub';
            badge.textContent = options.count ? String(options.count) : '';
            head.appendChild(badge);
        }

        head.appendChild(chevron());
        head.onclick = function () {
            group.classList.toggle('collapsed');
            options.remember(group.classList.contains('collapsed'));
            saveCollapsed();
        };
        head.onkeydown = function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                head.click();
            }
        };

        var inner = document.createElement('div');
        inner.className = 'group-inner';
        if (options.rows.length) {
            options.rows.forEach(function (profile) { inner.appendChild(profileRow(profile)); });
        } else {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = options.emptyText;
            inner.appendChild(empty);
        }

        var body = document.createElement('div');
        body.className = 'group-body';
        body.appendChild(inner);

        group.appendChild(head);
        group.appendChild(body);
        return group;
    }

    function renderSubscriptions() {
        clear(el.subscriptions);
        if (!model.subscriptions.length) {
            var hint = document.createElement('div');
            hint.className = 'empty';
            hint.textContent = 'Подписок нет — добавьте ссылку подписки из буфера обмена';
            el.subscriptions.appendChild(hint);
            return;
        }

        model.subscriptions.forEach(function (sub) {
            var subName = sub.name || 'Подписка';
            // Название может уже содержать эмодзи облака — не дублируем.
            var title = subName.indexOf('☁') === -1 ? '☁️ ' + subName : subName;
            el.subscriptions.appendChild(profileGroup({
                title: title,
                pingable: true,
                collapsed: collapsed.subscriptions[sub.id],
                remember: function (value) { collapsed.subscriptions[sub.id] = value; },
                rows: model.profiles.filter(function (p) { return p.subscriptionId === sub.id; }),
                emptyText: 'Пока нет профилей'
            }));
        });
    }

    function renderLocals() {
        clear(el.localGroup);
        var locals = model.profiles.filter(function (p) { return !p.fromSubscription; });
        profileGroup({
            title: 'Локальные профили',
            titleClass: 'group-title small',
            pingable: true,
            count: locals.length,
            collapsed: collapsed.local,
            remember: function (value) { collapsed.local = value; },
            rows: locals,
            emptyText: 'Профилей нет — скопируйте vless- или olcrtc-ссылку и импортируйте из буфера'
        }, el.localGroup);
    }

    function renderSubAdmin() {
        clear(el.subAdmin);
        if (!model.subscriptions.length) {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'Подписок нет';
            el.subAdmin.appendChild(empty);
            return;
        }
        model.subscriptions.forEach(function (sub) {
            var row = document.createElement('div');
            row.className = 'settings-row sub-row';

            var body = document.createElement('span');
            var name = document.createElement('span');
            name.textContent = sub.name || 'Подписка';
            body.appendChild(name);

            // Плашка настроек: адрес убран, вместо него то, что важно при работе
            // с подпиской, — сколько профилей пришло и когда ждать следующего.
            body.appendChild(document.createElement('br'));

            var countLine = document.createElement('small');
            countLine.textContent = 'Профилей: ' + (sub.count || 0);
            body.appendChild(countLine);

            // Без автообновления отсчёта не существует — строку прячем целиком.
            if (sub.refreshMinutes > 0) {
                // Перед строкой отсчёта <br> не нужен: <small> и так блочный,
                // а <br> между двумя блоками даёт пустую строку.
                var leftLine = document.createElement('small');
                leftLine.textContent = 'Обновление через: ' + countdownText(sub);
                // Исходные значения держим в data-*: тик правит только текст и не должен
                // зависеть от узлов, которые renderSubAdmin при следующем render() заменит.
                leftLine.dataset.refreshMinutes = sub.refreshMinutes;
                leftLine.dataset.updatedAt = sub.updatedAt || 0;
                leftLine.dataset.addedAt = sub.addedAt || 0;
                body.appendChild(leftLine);
            }

            row.appendChild(body);

            var refresh = document.createElement('button');
            refresh.className = 'value accent';
            if (sub.loading) {
              // Подписка грузится: вместо надписи — спиннер, повторный клик не нужен.
              refresh.disabled = true;
              refresh.appendChild(spinner());
            } else {
              refresh.textContent = 'Обновить';
              refresh.onclick = function () {
                log('обновляем «' + (sub.name || 'подписку') + '»');
                bridge.refreshSubscription(sub.id);
              };
            }
            row.appendChild(refresh);

            var remove = document.createElement('button');
            remove.className = 'value';
            remove.style.color = 'var(--red)';
            remove.textContent = 'Удалить';
            remove.onclick = function () {
                var name = sub.name || 'Подписка';
                var count = sub.count || 0;
                confirm('Удалить подписку?', function () {
                    bridge.removeSubscription(sub.id);
                    log('подписка удалена');
                }, 'Подписка «' + name + '» и её профили' +
                    (count ? ' (' + count + ')' : '') + ' будут удалены без возможности восстановления.');
            };
            row.appendChild(remove);

            el.subAdmin.appendChild(row);
        });
        syncCountdownTimer();
    }

    /**
     * Сколько осталось до следующего автообновления.
     *
     * Опора — последнее обновление, а если его не было ни разу, то момент
     * добавления подписки: иначе новая подписка показывала бы пустоту вместо
     * первого интервала.
     */
    function countdownText(sub) {
        var minutes = sub.refreshMinutes || 0;
        if (minutes <= 0) return '';
        var since = (sub.updatedAt || 0) > 0 ? sub.updatedAt : (sub.addedAt || 0);
        if (!since) return '—';
        var left = Math.floor((since + minutes * 60000 - Date.now()) / 1000);
        if (left <= 0) return 'сейчас';
        // Детализация только на последнем шаге: «57 мин 51 сек» и «8 ч 59 мин»
        // не влезают в колонку рядом с кнопками и рвутся пополам.
        if (left < 60) return left + ' сек';
        if (left < 3600) return Math.floor(left / 60) + ' мин';
        return Math.ceil(left / 3600) + ' ч';
    }

    function countdownNodes() {
        return el.subAdmin.querySelectorAll('small[data-refresh-minutes]');
    }

    /**
     * Секундный тик отсчёта.
     *
     * Живёт только пока в настройках есть хоть одна строка с отсчётом: иначе таймер
     * крутился бы вхолостую на главном экране. Перерисовывает исключительно текст —
     * полный render() дёргал бы всё дерево раз в секунду без нужды.
     */
    function syncCountdownTimer() {
        if (countdownTimer && !countdownNodes().length) {
            clearInterval(countdownTimer);
            countdownTimer = null;
            return;
        }
        if (countdownTimer || !countdownNodes().length) return;

        countdownTimer = setInterval(function () {
            countdownNodes().forEach(function (node) {
                node.textContent = 'Обновление через: ' + countdownText({
                    refreshMinutes: +node.dataset.refreshMinutes,
                    updatedAt: +node.dataset.updatedAt,
                    addedAt: +node.dataset.addedAt
                });
            });
        }, 1000);
    }

    var countdownTimer = null;

    function profileRow(profile) {
        var row = document.createElement('button');
        row.className = 'row';
        row.setAttribute('data-profile-id', profile.id);

        // Маркер один на строку: выбранный профиль помечен, как включённый режим
        // туннелирования. Подключение показывает кнопка питания и строка «Выбрано».
        var mark = document.createElement('span');
        mark.className = 'mark' + (profile.id === model.selectedProfileId ? ' on' : '');
        row.appendChild(mark);

        var body = document.createElement('span');
        body.className = 'row-body';

        var name = document.createElement('span');
        name.className = 'row-title';
        name.textContent = profile.name;

        var sub = document.createElement('span');
        sub.className = 'row-sub';
        sub.textContent = profile.type === 'olcrtc'
            ? 'OLCRTC / ' + (profile.provider || '—').toUpperCase() + ' / '
                + (profile.transport || '—')
            : 'VLESS / ' + (profile.network || 'TCP').toUpperCase() + ' / '
                + (profile.security || 'none').toUpperCase();

        body.appendChild(name);
        body.appendChild(document.createElement('br'));
        body.appendChild(sub);
        row.appendChild(body);

        // Плашка результата стоит рядом с «i». Элемент всегда в DOM и обновляется
        // точечно, поэтому перерисовывать весь список на каждый ответ не нужно.
        var badge = document.createElement('span');
        badge.className = 'ping-badge';
        row.appendChild(badge);

        var info = document.createElement('span');
        info.className = 'info-btn' + (profile.id === model.activeProfileId ? ' active' : '');
        info.textContent = 'i';
        info.onclick = function (event) {
            event.stopPropagation();
            openModal(profile.id);
        };
        row.appendChild(info);

        row.onclick = function () {
            // Тап по строке только выбирает профиль. Повторный тап по уже выбранному
            // ничего не делает — VPN включает только кнопка питания.
            if (profile.id === model.selectedProfileId) return;
            bridge.selectProfile(profile.id);
        };

        return row;
    }

    // ------------------------------------------------------------------ модалка

    function openModal(profileId) {
        var profile = profileById(profileId);
        if (!profile) return;
        modalProfileId = profileId;
        el.modalTitle.textContent = profile.name;
        clear(el.modalBody);

        // Пара лежит в списке: голый ['Источник', value] в concat() разворачивается
        // в два отдельных элемента, и дальше значение достаётся по индексам строки.
        var source = [['Источник', profile.fromSubscription
            ? (profile.subscriptionName || 'подписка') : 'буфер обмена']];

        var details = profile.type === 'olcrtc' ? [
            ['Тип', 'OLCRTC'],
            ['Провайдер', (profile.provider || '—').toUpperCase()],
            ['Транспорт', profile.transport || '—'],
            ['Комната', profile.room || '—']
        ].concat(source) : [
            ['Адрес', profile.address + (profile.port ? ':' + profile.port : '')],
            ['Сеть', (profile.network || 'tcp').toUpperCase()],
            ['Защита', (profile.security || 'none').toUpperCase()],
            ['SNI', profile.sni || '—']
        ].concat(source);

        details.concat([['Ссылка', profile.link]]).forEach(function (pair) {
            var row = document.createElement('div');
            row.className = 'detail';
            var key = document.createElement('span');
            key.className = 'k';
            key.textContent = pair[0];
            var value = document.createElement('span');
            value.className = 'v';
            value.textContent = pair[1] || '—';
            row.appendChild(key);
            row.appendChild(value);
            el.modalBody.appendChild(row);
        });

        el.modalConnect.textContent = profile.id === model.activeProfileId ? 'Отключиться' : 'Подключиться';
        el.modal.classList.add('open');
        el.scrim.classList.add('open');
    }

    function closeOverlays() {
        el.sheet.classList.remove('open');
        el.themeSheet.classList.remove('open');
        el.modal.classList.remove('open');
        el.alert.classList.remove('open');
        el.scrim.classList.remove('open');
    }

    /** Подпись в строке настроек и галочка в листе выбора темы. */
    function renderTheme() {
        el.themeValue.textContent = THEME_NAMES[themeMode] || THEME_NAMES.system;
        var items = el.themeSheet.querySelectorAll('[data-theme-mode]');
        Array.prototype.forEach.call(items, function (item) {
            var on = item.getAttribute('data-theme-mode') === themeMode;
            item.classList.toggle('current', on);
        });
    }

    /** Выбор темы приходит из приложения: там он и хранится, переживая перезапуск. */
    window.onThemeMode = function (mode) {
        themeMode = mode || 'system';
        renderTheme();
    };

    /**
     * Подтверждение опасного действия своим диалогом, а не системным окном.
     * `text` — короткий вопрос, `detail` — чем грозит действие.
     */
    function confirm(text, onYes, detail) {
        closeOverlays();
        el.alertTitle.textContent = text;
        el.alertText.textContent = detail || '';
        el.alertText.style.display = detail ? '' : 'none';
        el.alertOk.textContent = 'Удалить';
        el.alert.classList.add('open');
        el.scrim.classList.add('open');

        // Колбэк живёт до нажатия кнопки: диалог живёт дольше текущего клика.
        el.alertOk.onclick = function () {
            closeOverlays();
            onYes();
        };
        el.alertCancel.onclick = closeOverlays;
    }

    // ------------------------------------------------- раздельное туннелирование

    var splitMode = 'all';
    /** Выбранные пакеты как объект-ключ: проверка в O(1) без пересборки массивов. */
    var splitPackages = {};

    var elSplit = {
        all: document.getElementById('splitAll'),
        allow: document.getElementById('splitAllow'),
        exclude: document.getElementById('splitExclude'),
        pick: document.getElementById('splitPick'),
        picker: document.getElementById('appPicker'),
        list: document.getElementById('pickerList'),
        loading: document.getElementById('pickerLoading'),
        query: document.getElementById('pickerQuery'),
        searchClear: document.getElementById('pickerSearchClear'),
        system: document.getElementById('pickerSystem'),
        clear: document.getElementById('pickerClear'),
        title: document.getElementById('pickerTitle')
    };

    function loadSplit() {
        var data = parse(bridge.getSplitTunnelSettings());
        if (!data) return;
        splitMode = data.mode || 'all';
        splitPackages = {};
        (data.packages || []).forEach(function (pkg) { splitPackages[pkg] = true; });
        renderSplit();
    }

    /**
     * Выбранный режим отмечается на самом маркере, а не на строке: строка нужна
     * целиком под нажатие, и никакого своего выделения она не несёт.
     */
    function setModeMark(row, on) {
        row.querySelector('.mark').classList.toggle('on', on);
    }

    function renderSplit() {
        setModeMark(elSplit.all, splitMode === 'all');
        setModeMark(elSplit.allow, splitMode === 'allow');
        setModeMark(elSplit.exclude, splitMode === 'exclude');
        var count = Object.keys(splitPackages).length;
        elSplit.pick.hidden = splitMode === 'all';
        elSplit.pick.textContent = count ? 'Выбрать приложения · ' + count : 'Выбрать приложения';
        elSplit.clear.disabled = count === 0;
    }

    /** При отказе ядра режим и список пакетов остаются прежними. */
    function setSplitMode(mode) {
        if (mode === splitMode) return;
        var reply = parse(bridge.setSplitTunnelMode(mode)) || {};
        if (reply.ok === false) {
            log(reply.error || 'не удалось сменить режим');
            return;
        }
        splitMode = mode;
        renderSplit();
    }

    /**
     * Показывается с задержкой в 150 мс: список на быстрых устройствах приходит
     * быстрее, и мигающий спиннер выглядел бы хуже отсутствия спиннера.
     */
    var loadingTimer = null;

    function showPickerLoading() {
        clearTimeout(loadingTimer);
        loadingTimer = setTimeout(function () { elSplit.loading.hidden = false; }, 150);
    }

    function hidePickerLoading() {
        clearTimeout(loadingTimer);
        elSplit.loading.hidden = true;
    }

    function openPicker() {
        elSplit.title.textContent = splitMode === 'allow'
            ? 'Приложения через VPN'
            : 'Приложения в обход';
        elSplit.query.value = '';
        syncSearchClear();
        elSplit.system.checked = false;
        elSplit.picker.classList.add('open');
        requestApps();
    }

    function closePicker() {
        elSplit.picker.classList.remove('open');
    }

    var pickerRequest = 0;

    /**
     * Основной путь асинхронный: мост считает список в отдельном потоке и
     * отвечает вызовом window.onSplitApps. Синхронный вызов на сотнях пакетов
     * заметно тормозит и замораживает страницу на слабых устройствах, причём
     * индикатор загрузки успевает скрыться, не показавшись.
     * Синхронный путь остался запасным, если асинхронных методов у моста нет.
     */
    function requestApps() {
        var token = ++pickerRequest;
        showPickerLoading();
        clear(elSplit.list);
        var includeSystem = elSplit.system.checked;
        var query = elSplit.query.value.trim();
        if (bridge.listInstalledAppsAsync) {
            bridge.listInstalledAppsAsync(String(token), includeSystem, query);
            return;
        }
        setTimeout(function () {
            if (token !== pickerRequest) return;
            var reply = bridge.listInstalledApps(includeSystem, query);
            if (reply && typeof reply.then === 'function') {
                reply.then(function (data) { applyApps(token, data); });
                return;
            }
            applyApps(token, reply);
        }, 0);
    }

    /** Принимает список приложений, отбрасывая устаревшие ответы. */
    function applyApps(token, payload) {
        if (Number(token) !== pickerRequest) return;
        hidePickerLoading();
        renderApps(parse(payload) || []);
    }

    window.onSplitApps = applyApps;

    /**
     * Иконки не запрашиваются здесь: их отрисовка идёт порциями по мере прокрутки,
     * иначе сотня синхронных вызовов моста замораживает страницу.
     */
    function renderApps(apps) {
        clear(elSplit.list);
        var chosen = apps.filter(function (app) { return splitPackages[app.pkg]; });
        var rest = apps.filter(function (app) { return !splitPackages[app.pkg]; });

        if (chosen.length) {
            elSplit.list.appendChild(pickerGroup('Выбранные'));
            chosen.forEach(function (app) { elSplit.list.appendChild(appRow(app)); });
        }
        if (rest.length) {
            if (chosen.length) elSplit.list.appendChild(pickerGroup('Остальные'));
            rest.forEach(function (app) { elSplit.list.appendChild(appRow(app)); });
        }
        if (!apps.length) {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = elSplit.query.value.trim()
                ? 'Ничего не найдено'
                : 'Нет приложений для выбора';
            elSplit.list.appendChild(empty);
        }
        watchIcons();
    }

    function pickerGroup(title) {
        var node = document.createElement('div');
        node.className = 'picker-group';
        node.textContent = title;
        return node;
    }

    function appRow(app) {
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'app-row' + (splitPackages[app.pkg] ? ' on' : '');

        var icon = document.createElement('img');
        icon.className = 'app-icon';
        icon.alt = '';
        icon.setAttribute('data-pkg', app.pkg);
        row.appendChild(icon);

        var copy = document.createElement('span');
        copy.className = 'app-copy';
        var name = document.createElement('span');
        name.className = 'app-name';
        name.textContent = app.label || app.pkg;
        var pkg = document.createElement('span');
        pkg.className = 'app-pkg';
        pkg.textContent = app.pkg;
        copy.appendChild(name);
        copy.appendChild(pkg);
        row.appendChild(copy);

        row.appendChild(document.createElement('span')).className = 'app-box';

        // Отметка меняется локально: к ядру уходит только по кнопке «Готово».
        row.onclick = function () {
            if (splitPackages[app.pkg]) delete splitPackages[app.pkg];
            else splitPackages[app.pkg] = true;
            requestApps();
            renderSplit();
        };

        return row;
    }

    /**
 * Режим без единого приложения ничего не делает, поэтому при уходе
 * с настроек, сворачивании или следующем запуске он сбрасывается в «Все приложения».
 */
    function enforceSplitFallback() {
        if (splitMode === 'all') return;
        if (Object.keys(splitPackages).length) return;
        splitMode = 'all';
        bridge.setSplitTunnelMode('all');
        renderSplit();
        log('режим сброшен: не выбрано ни одного приложения');
    }

    /*
     * Иконки приложений.
     *
     * Страница просит иконку обычной картинкой по адресу nodeway.internal/icon/<pkg>,
     * а нативная часть отдаёт её прямо из PackageManager, перехватив запрос. Раньше
     * иконка ехала мостом и вставлялась в картинку строкой base64: переход в JS,
     * перекодирование, ожидание ответа — из-за чего здесь и выросли очередь с
     * пачками, кэш и разбор ответа. Теперь браузер сам решает, что грузить и когда.
     *
     * Ленивость осталась: строки заводятся только близкие к экрану, иначе список
     * из сотни приложений дёргал бы загрузку при каждой прокрутке.
     */

    /** Адрес, который в приложении перехватывается, а в сети ничего не значит. */
    var ICON_BASE_URL = 'https://nodeway.internal/icon/';

    /**
     * Откуда брать иконку пакета.
     *
     * В демо-режиме перехвата нет и такой адрес не резолвится, поэтому мок
     * подставляет свой через window.__nodewayIconUrl. Это единственное место,
     * где страница знает о моке.
     */
    function iconUrlFor(pkg) {
        if (window.__nodewayIconUrl) return window.__nodewayIconUrl(pkg);
        return ICON_BASE_URL + encodeURIComponent(pkg);
    }

    var iconObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            iconObserver.unobserve(entry.target);
            var img = entry.target.querySelector('img[data-pkg]');
            if (img) img.src = iconUrlFor(img.getAttribute('data-pkg'));
        });
    }, { root: elSplit.list, rootMargin: '240px 0px' });

    function watchIcons() {
        iconObserver.disconnect();
        var images = elSplit.list.querySelectorAll('img[data-pkg]');
        Array.prototype.forEach.call(images, function (img) {
            // Уже запрошенная иконка остаётся на месте: перерисовка списка
            // не должна начинать всё заново.
            if (img.getAttribute('src')) return;
            iconObserver.observe(img.parentNode);
        });
    }

    elSplit.all.onclick = function () { setSplitMode('all'); };
    elSplit.allow.onclick = function () { setSplitMode('allow'); };
    elSplit.exclude.onclick = function () { setSplitMode('exclude'); };
    elSplit.pick.onclick = openPicker;
    document.getElementById('pickerClose').onclick = closePicker;
    elSplit.system.onchange = requestApps;

    /**
     * К ядру список уходит только по кнопке «Готово», поэтому очистка обратима:
     * закрытый лист ничего не меняет.
     */
    elSplit.clear.onclick = function () {
        if (!Object.keys(splitPackages).length) return;
        splitPackages = {};
        requestApps();
        renderSplit();
    };

    /* Сворачивание приложения тоже считаем уходом: режим без выбора не сохраняем. */
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) enforceSplitFallback();
    });

    /* Поиск ждёт паузу в наборе: запрос на каждый символ лишний. */
    var searchTimer = null;
    elSplit.query.oninput = function () {
        clearTimeout(searchTimer);
        syncSearchClear();
        searchTimer = setTimeout(requestApps, 250);
    };

    /**
     * Показывает себя только при непустом поле: пустой крестик только мешает.
     * После очистки фокус возвращается в поле, чтобы можно было сразу печатать.
     */
    function syncSearchClear() {
        elSplit.searchClear.hidden = !elSplit.query.value.length;
    }

    elSplit.searchClear.onclick = function () {
        clearTimeout(searchTimer);
        elSplit.query.value = '';
        syncSearchClear();
        requestApps();
        elSplit.query.focus();
    };

    document.getElementById('pickerDone').onclick = function () {
        var packages = Object.keys(splitPackages);
        var reply = parse(bridge.setSelectedPackages(JSON.stringify(packages))) || {};
        if (reply.ok === false) {
            log(reply.error || 'не удалось сохранить список');
            return;
        }
        closePicker();
        log('в списке приложений: ' + packages.length);
    };

    // ------------------------------------------------------------------ события

    var lastMessage = '';

    el.powerBtn.onclick = function () {
        if (state === 'connected') {
            bridge.requestDisconnect();
            return;
        }
        var profile = selectedProfile() || model.profiles[0];
        if (!profile) {
            log('сначала добавьте профиль');
            showPage('pageSettings');
            return;
        }
        if (profile.id !== model.selectedProfileId) bridge.selectProfile(profile.id);
        bridge.requestConnect(profile.id);
    };

    /* Чип статуса информационный: тап по нему ничего не делает. */

    document.getElementById('addBtn').onclick = function () {
        el.sheet.classList.add('open');
        el.scrim.classList.add('open');
    };

    document.getElementById('logHead').onclick = function () {
        logCollapsed = !logCollapsed;
        el.logBody.style.display = logCollapsed ? 'none' : 'block';
        el.logChev.style.transform = logCollapsed ? 'rotate(-90deg)' : '';
        collapsed.log = logCollapsed;
        saveCollapsed();
        // При разворачивании список в DOM ещё пуст — рисуем с нуля.
        if (!logCollapsed) {
            renderFull = true;
            renderJournal();
        }
    };

    el.logFilter.onclick = function (event) {
        var button = event.target.closest('button');
        if (!button) return;
        logFilter = button.dataset.level;
        el.logFilter.querySelectorAll('button').forEach(function (item) {
            item.classList.toggle('active', item === button);
        });
        renderFull = true;
        renderJournal();
    };

    el.journalRow.onclick = function () {
        var wasEnabled = journalEnabled;
        var reply = parse(bridge.setJournalEnabled(!journalEnabled));
        if (!reply) return;
        applyJournalEnabled(reply.enabled);
        // Файл логов ядро открывает только на старте, поэтому включённый на ходу
        // журнал наберёт полноту после следующего подключения — говорим об этом.
        if (!wasEnabled && state === 'connected') {
            log('вывод Xray появится со следующего подключения');
        }
    };

    document.getElementById('importProfiles').onclick = function () {
        var reply = parse(bridge.importFromClipboard());
        if (reply) log(reply.message);
    };

    el.scrim.onclick = closeOverlays;

    document.getElementById('settingsBtn').onclick = function () { showPage('pageSettings'); };
    document.getElementById('backBtn').onclick = function () { showPage('pageHome'); };

    function showPage(id) {
        // Уход с настроек без отмеченных приложений возвращает режим «Все приложения».
        if (id !== 'pageSettings') enforceSplitFallback();
        document.querySelectorAll('.page').forEach(function (page) {
            page.classList.toggle('active', page.id === id);
        });
        // «+» и шестерёнка относятся только к списку профилей.
        document.querySelector('.navbar').classList.toggle('hidden', id !== 'pageHome');
        window.scrollTo(0, 0);
    }

    el.themeRow.onclick = function () {
    renderTheme();
    el.themeSheet.classList.add('open');
    el.scrim.classList.add('open');
  };

  el.themeSheet.addEventListener('click', function (event) {
    var mode = event.target.getAttribute('data-theme-mode');
    closeOverlays();
    if (!mode) return;
    bridge.setThemeMode(mode);
  });

  el.sheet.addEventListener('click', function (event) {
        var action = event.target.getAttribute('data-action');
        if (!action) return;
        closeOverlays();
        if (action === 'import') {
            // Подписка или отдельные ссылки — определяется по содержимому буфера.
            var reply = parse(bridge.importFromClipboard());
            if (reply) log(reply.message);
        }
    });

    el.modal.addEventListener('click', function (event) {
        var action = event.target.getAttribute('data-action');
        if (!action) return;
        if (action === 'modal-close') closeOverlays();
        if (action === 'modal-connect') {
            var profile = profileById(modalProfileId);
            closeOverlays();
            if (!profile) return;
            if (profile.id === model.activeProfileId) bridge.requestDisconnect();
            else {
                if (profile.id !== model.selectedProfileId) bridge.selectProfile(profile.id);
                bridge.requestConnect(profile.id);
            }
        }
        if (action === 'modal-remove') {
            var target = profileById(modalProfileId);
            if (!target) return;
            confirm('Удалить профиль?', function () {
                bridge.removeProfile(target.id);
                log('профиль «' + target.name + '» удалён');
            }, 'Профиль «' + target.name + '» будет удалён без возможности восстановления.');
        }
    });

    // ------------------------------------------------------------------ мост

    /**
     * Высота системных панелей в CSS-пикселях — её сообщает приложение.
     * В WebView `env(safe-area-inset-*)` пустой, поэтому значения приходят из Kotlin.
     * В браузере остаётся запасной вариант через `env()` в CSS.
     */
    window.setInsets = function (top, bottom) {
        document.documentElement.style.setProperty('--inset-top', (top || 0) + 'px');
        document.documentElement.style.setProperty('--inset-bottom', (bottom || 0) + 'px');
    };

  /**
   * Режим оформления: светлый или тёмный. Сообщает приложение, тем же путём,
   * что и отступы. Меняется только набор токенов — разметка та же.
   */
  window.setUiMode = function (mode) {
    document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
  };

    window.onVpnState = function (payload) {
        var data = parse(payload);
        if (!data) return;
        state = data.state;
        lastMessage = data.message || '';
        model.latency = Number(data.latency) || 0;
        if (data.ping) {
            var next = normalizePing(data.ping);
            if (next.total > 0) {
                // Пошёл новый прогон — прежние плашки уходят.
                ping = next;
            } else {
                // Прогона нет: результаты держим на экране, обновляя только шаг.
                // Иначе они стирались бы в любой посторонний момент — сервис
                // после проверки гаснет и поднимается с пустой памятью.
                ping.running = next.running;
                ping.index = next.index;
                ping.total = next.total;
                ping.profileId = next.profileId;
                Object.keys(next.results).forEach(function (key) {
                    ping.results[key] = next.results[key];
                });
            }
        }
        renderPower();
        // В журнал пишет нативная часть — оттуда он переживает перезагрузку страницы.
        renderUptime();
        renderLatency();
        updatePingBadges();
        updatePingButtons();
    };

    window.onProfilesChanged = function (payload) {
        var data = parse(payload);
        if (!data) return;
        model = data;
        render();
    };

    window.onImportResult = function (payload) {
        var data = parse(payload);
        if (!data) return;
        log(data.message);
        render();
    };

    // ------------------------------------------------------------------ init

    if (bridge) {
        var initial = parse(bridge.getInitialState());
        if (initial) {
            model = initial.state;
            // Состояние туннеля приходит в стартовом снимке: пока сервис молчит,
            // а страница загрузилась заново, иначе показала бы «Отключено».
            state = model.vpnState || 'disconnected';
            ping = normalizePing(model.ping);
            coreVersion = initial.coreVersion || '';
            applyJournalEnabled(!!initial.journalEnabled);
            if (initial.appVersion) {
                document.getElementById('appVersion').textContent = initial.appVersion;
            }
        }
        el.coreVersion.textContent = coreVersion || '—';
        el.logChev.innerHTML = ICON_CHEV;
        logCollapsed = collapsed.log;
        el.logBody.style.display = logCollapsed ? 'none' : 'block';
        el.logChev.style.transform = logCollapsed ? 'rotate(-90deg)' : '';
        loadSplit();
        log('интерфейс готов');
    } else {
        log('Android-мост недоступен');
    }

    render();
    setInterval(renderUptime, 1000);
})();
</script>
</body>
</html>
