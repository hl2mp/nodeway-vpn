jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v2
        with:
          api-level: 34
          ndk-version: 26.1.10909125

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
