name: Debug APK release

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_COMPILE_SDK: "34"
          ANDROID_BUILD_TOOLS: "34.0.0"
        run: |
          echo "sdkmanager path: $(which sdkmanager || true)"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(grep -Eo 'versionName *= *"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)"/\1/')"
          if [ -z "$VERSION" ]; then
            echo "versionName not found in app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file_name=nodetun-v${VERSION}-universal.apk" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to release filename
        shell: bash
        run: |
          SRC="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "No APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$SRC" "release-artifacts/${{ steps.version.outputs.file_name }}"
          ls -l release-artifacts

      - name: Publish GitHub Release with debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Debug APK ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}